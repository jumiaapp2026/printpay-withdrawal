<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa B2C Withdrawal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
    h2 { margin-top: 0; color: #111827; font-size: 1.4rem; }
    p.sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #374151; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; }
    input:focus, select:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
    button { width: 100%; padding: 12px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #15803d; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; word-break: break-word; }
    .status.success { display: block; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status.error { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Send Payout (B2C)</h2>
    <p class="sub">Enter recipient details to initiate an M-Pesa withdrawal.</p>

    <form id="withdrawForm">
      <label for="phone">Recipient Phone Number</label>
      <input type="tel" id="phone" placeholder="0712345678" maxlength="10" required />

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" placeholder="1000" min="10" required />

      <label for="command_id">Payment Type</label>
      <select id="command_id">
        <option value="BusinessPayment">Business Payment</option>
        <option value="SalaryPayment">Salary Payment</option>
        <option value="PromotionPayment">Promotion Payment</option>
      </select>

      <button type="submit" id="submitBtn">Withdraw Funds</button>
    </form>

    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const form = document.getElementById('withdrawForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.className = 'status';
      statusBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      const payload = {
        phone: document.getElementById('phone').value,
        amount: document.getElementById('amount').value,
        command_id: document.getElementById('command_id').value
      };

      try {
        const res = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (res.ok && result.success) {
          statusBox.className = 'status success';
          statusBox.textContent = 'Payout initiated: ' + JSON.stringify(result.data);
          form.reset();
        } else {
          statusBox.className = 'status error';
          statusBox.textContent = result.error || 'Transaction failed.';
        }
      } catch (err) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Withdraw Funds';
      }
    });
  </script>
</body>
</html>
